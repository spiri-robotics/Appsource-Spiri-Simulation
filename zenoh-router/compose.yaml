# zenoh-router: the router every simulated thing meets at. Gazebo's
# gz-transport, each sim robot's SpiriSynq, and anything joining from the LAN
# (a real Mu's router, a developer's native Gazebo client) connect here.
# Install this first; the other apps join the `spirisynq` network it creates
# and find it by name.
services:
  zenoh-router:
    # The Mu's version, so the appliance's router and every robot's are alike.
    image: eclipse/zenoh:1.10.1
    restart: unless-stopped
    networks:
      - spirisynq
    ports:
      - "7447:7447"
    # Each sim robot runs the Mu's own zenoh-router app, whose host-mode
    # router lands on this network. Routers don't connect to each other by
    # default, so this one does the scouting and joins every robot's router
    # as it appears; the robots stay configured exactly like real Mus.
    command:
      - -l
      - tcp/0.0.0.0:7447
      - --cfg
      - 'scouting/multicast/autoconnect:{router:["router","peer"],peer:["router","peer"]}'

networks:
  spirisynq:
    name: spirisynq
